<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Preview: Min Gao</title>
    <link rel="icon" type="image/png" href="images/fudan_logo_blue.png">
    <link rel="stylesheet" href="stylesheet.css">
    <style>
      pre, code { white-space: pre-wrap; }
      .note { color: #8a94a0; font-size: 0.85em; text-align: center; margin: 4px 0 0; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <main class="container">
      <p class="note">Local preview — renders index.md in the browser with stylesheet.css applied.</p>
      <div id="content"></div>
    </main>
    <footer class="container" style="margin:24px auto 0;text-align:right">
      <small>Modified from <a href="https://jonbarron.info/">Jon Barron</a></small>
    </footer>
    <script>
      async function loadMarkdown() {
        const resp = await fetch('index.md', { cache: 'no-cache' });
        let text = await resp.text();
        // Strip YAML front matter between leading --- blocks
        if (text.startsWith('---')) {
          const end = text.indexOf('\n---', 3);
          if (end !== -1) text = text.slice(end + 4);
        }
        document.getElementById('content').innerHTML = marked.parse(text);
      }
      loadMarkdown();
    </script>
  </body>
</html>
