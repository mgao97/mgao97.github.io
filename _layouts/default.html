<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <link rel="icon" type="image/png" href="{{ '/images/fudan_logo_blue.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/stylesheet.css' | relative_url }}">
  </head>
  <body>
    <nav class="nav-bar">
      <div class="nav-container">
        <a class="nav-brand" href="{{ '/' | relative_url }}">Min Gao</a>
        <div class="nav-links">
          <a class="nav-link {% if page.url == '/' %}active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
          <a class="nav-link {% if page.url contains 'projects' %}active{% endif %}" href="{{ '/projects' | relative_url }}">Projects</a>
          <a class="nav-link {% if page.url contains 'publications' %}active{% endif %}" href="{{ '/publications' | relative_url }}">Publications</a>
          <a class="nav-link {% if page.url contains 'services' %}active{% endif %}" href="{{ '/services' | relative_url }}">Services</a>
          <a class="nav-link {% if page.url contains 'awards' %}active{% endif %}" href="{{ '/awards' | relative_url }}">Awards</a>
        </div>
      </div>
    </nav>
    <main class="container">
      {{ content }}
    </main>
    <footer class="container" style="margin:24px auto 0;text-align:right">
      <small>Modified from <a href="https://jonbarron.info/">Jon Barron</a></small>
    </footer>
  </body>
</html>
